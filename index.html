<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>신선여자고등학교 창체 알리미</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fecdd3; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #fb7185; }
        
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }

        .thumbnail-hover:hover .play-icon { transform: scale(1.1); background-color: #fb7185; }
    </style>
</head>
<body class="bg-rose-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 아이콘 컴포넌트 (SVG) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                monitor: <path d="M2 3h20v14H2z M8 21h8 M12 17v4" />,
                calendar: <path d="M3 4h18v16H3z M16 2v4 M8 2v4 M3 10h18" />,
                fileText: <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8" />,
                play: <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" />,
                loader: <path d="M12 2v4 M12 18v4 M4.93 4.93l2.83 2.83 M16.24 16.24l2.83 2.83 M2 12h4 M18 12h4 M4.93 19.07l2.83-2.83 M16.24 7.76l2.83-2.83" />,
                external: <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14L21 3" />
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name]}
                </svg>
            );
        };

        const SPREADSHEET_ID = "1n_Rq2f6mq2qCWFaixYLXqmzGQtRCR7-2CS8r67t_620"; 

        // 유튜브 ID 추출
        const extractVideoId = (url) => {
            if (!url) return '';
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|live\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        // --- 날짜 처리 ---
        // 구글 시트 날짜 형식(Date(2026,8,30)), 2026-09-30, 2026.9.30, 2026. 9. 30., 9/30, 9월 30일 등을 모두 인식
        const parseDate = (raw) => {
            if (!raw) return null;
            const s = String(raw);
            let m = s.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
            if (m) return new Date(+m[1], +m[2], +m[3]);
            m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
            if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
            m = s.match(/(\d{1,2})\s*[\/.월-]\s*(\d{1,2})/);
            if (m) return new Date(new Date().getFullYear(), +m[1] - 1, +m[2]);
            return null;
        };

        const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
        const formatDate = (d) => {
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${mm}-${dd} (${WEEKDAYS[d.getDay()]})`;
        };

        const startOfToday = () => {
            const n = new Date();
            return new Date(n.getFullYear(), n.getMonth(), n.getDate());
        };

        // 오늘과 며칠 차이인지 (0 = 오늘, 양수 = 미래, 음수 = 과거)
        const dayDiff = (d) => d ? Math.round((d - startOfToday()) / 86400000) : null;

        // 처음 보여줄 영상: 오늘 영상 → 없으면 가장 가까운 다음 일정 → 없으면 가장 최근 지난 일정
        const pickInitial = (items) => {
            const dated = items.filter(i => i.dateObj);
            const today = dated.find(i => dayDiff(i.dateObj) === 0);
            if (today) return today;
            const upcoming = dated.filter(i => dayDiff(i.dateObj) > 0)
                .sort((a, b) => a.dateObj - b.dateObj)[0];
            if (upcoming) return upcoming;
            const past = dated.sort((a, b) => b.dateObj - a.dateObj)[0];
            return past || items[0] || null;
        };

        // --- 썸네일 (누르면 유튜브로 이동) ---
        const VideoPlayer = ({ videoId }) => {
            return (
                <div
                    onClick={() => window.open(`https://www.youtube.com/watch?v=${videoId}`, '_blank')}
                    className="mb-10 aspect-video bg-black rounded-[2rem] overflow-hidden shadow-2xl border-8 border-white group relative cursor-pointer thumbnail-hover transition-all duration-300"
                >
                    <img
                        src={`https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`}
                        alt="영상 미리보기"
                        className="w-full h-full object-cover opacity-70 group-hover:opacity-50 transition-opacity duration-500"
                        onError={(e) => { e.target.onerror = null; e.target.src = `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`; }}
                    />
                    <div className="absolute inset-0 flex flex-col items-center justify-center gap-6">
                        <div className="play-icon w-24 h-24 bg-rose-500 text-white rounded-full flex items-center justify-center shadow-2xl transition-all duration-300">
                            <Icon name="play" size={40} className="ml-2" />
                        </div>
                        <div className="bg-white/10 backdrop-blur-md px-6 py-3 rounded-full border border-white/20 flex items-center gap-3">
                            <span className="text-white font-bold text-lg tracking-wide">유튜브에서 시청하기</span>
                            <Icon name="external" size={18} className="text-white/80" />
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [sheetData, setSheetData] = useState([]); 
            const [currentActivity, setCurrentActivity] = useState(null);
            const [isLoading, setIsLoading] = useState(true);
            const [error, setError] = useState(null);

            useEffect(() => {
                window.handleResponse = (response) => {
                    try {
                        const rows = response.table.rows;
                        const formatted = rows.map((row, idx) => {
                            const cells = row.c || [];
                            const rawDate = cells[0] ? String(cells[0].v ?? '') : '';
                            const dateObj = parseDate(rawDate);
                            return {
                                id: idx,
                                rawDate,
                                dateObj,
                                date: dateObj ? formatDate(dateObj) : (cells[0] && cells[0].f) || rawDate,
                                title: cells[1] ? String(cells[1].v || '제목 없음') : '제목 없음',
                                videoId: extractVideoId(cells[2] ? String(cells[2].v || '') : ''),
                                description: cells[3] ? String(cells[3].v || '') : ''
                            };
                        }).filter(item => item.videoId && item.rawDate);

                        setSheetData(formatted);
                        setCurrentActivity(pickInitial(formatted));
                    } catch (err) {
                        setError("데이터 형식이 올바르지 않습니다.");
                    } finally {
                        setIsLoading(false);
                    }
                };

                const script = document.createElement('script');
                script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleResponse&cachebust=${Date.now()}`;
                script.onerror = () => { setError("데이터를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요."); setIsLoading(false); };
                document.body.appendChild(script);

                return () => { delete window.handleResponse; };
            }, []);

            // 처음 선택된(오늘) 항목이 목록에서 보이도록 스크롤
            useEffect(() => {
                if (!currentActivity) return;
                const el = document.querySelector(`[data-item-id="${currentActivity.id}"]`);
                if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }, [currentActivity]);

            if (isLoading) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center gap-4">
                        <div className="animate-spin text-rose-500"><Icon name="loader" /></div>
                        <p className="text-rose-500 font-bold">데이터를 불러오는 중...</p>
                    </div>
                );
            }

            if (error) {
                return <div className="h-screen flex items-center justify-center text-rose-600 font-bold">{error}</div>;
            }

            const currentDiff = currentActivity ? dayDiff(currentActivity.dateObj) : null;

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* 왼쪽 사이드바 */}
                    <aside className="w-80 bg-white border-r border-rose-100 flex flex-col shadow-lg z-10">
                        <div className="p-6 border-b border-rose-50">
                            <h1 className="text-xl font-bold text-rose-500 flex items-center gap-2">
                                <Icon name="monitor" />
                                <span>창체 알리미</span>
                            </h1>
                            <p className="text-slate-400 text-xs mt-1">신선여자고등학교 교육 안내</p>
                        </div>
                        
                        <nav className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest ml-1 mb-2">교육 일정 목록</div>
                            {sheetData.map((item) => {
                                const selected = currentActivity?.id === item.id;
                                const today = dayDiff(item.dateObj) === 0;
                                return (
                                    <button 
                                        key={item.id}
                                        data-item-id={item.id}
                                        onClick={() => setCurrentActivity(item)}
                                        className={`w-full text-left p-4 rounded-2xl transition-all duration-200 border ${
                                            selected
                                            ? 'bg-rose-500 border-rose-500 text-white shadow-lg shadow-rose-200 scale-[1.02]' 
                                            : today
                                            ? 'bg-rose-50 border-rose-300 hover:bg-rose-100'
                                            : 'bg-white border-slate-100 hover:border-rose-200 hover:bg-rose-50'
                                        }`}
                                    >
                                        <div className="flex justify-between items-start mb-1">
                                            <span className={`text-[11px] font-bold ${selected ? 'text-rose-100' : 'text-slate-400'}`}>
                                                {item.date}
                                            </span>
                                            {today && (
                                                <span className={`text-[9px] px-1.5 py-0.5 rounded-full font-bold ${selected ? 'bg-white text-rose-500' : 'bg-rose-500 text-white'}`}>TODAY</span>
                                            )}
                                        </div>
                                        <div className="font-bold truncate text-sm">{item.title}</div>
                                    </button>
                                );
                            })}
                        </nav>
                        
                        <div className="p-4 bg-rose-50/50 border-t border-rose-100 text-[10px] text-center text-slate-400 font-medium">
                            © 신선여자고등학교
                        </div>
                    </aside>

                    {/* 오른쪽 메인 콘텐츠 */}
                    <main className="flex-1 overflow-y-auto bg-rose-50/30 p-8 custom-scrollbar">
                        {currentActivity ? (
                            <div key={currentActivity.id} className="max-w-5xl mx-auto animate-fade-in">
                                <header className="mb-8">
                                    <div className="flex flex-wrap items-center gap-2 mb-4">
                                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-rose-200 text-rose-500 text-xs font-bold shadow-sm">
                                            <Icon name="calendar" size={16} /> {currentActivity.date} 교육 자료
                                        </div>
                                        {currentDiff === 0 && (
                                            <span className="px-3 py-1 rounded-full bg-rose-500 text-white text-xs font-bold shadow-sm">오늘의 교육</span>
                                        )}
                                        {currentDiff > 0 && (
                                            <span className="px-3 py-1 rounded-full bg-amber-100 text-amber-700 text-xs font-bold">{currentDiff}일 후 예정</span>
                                        )}
                                    </div>
                                    <h2 className="text-4xl font-black text-slate-800 tracking-tight leading-tight">
                                        {currentActivity.title}
                                    </h2>
                                </header>

                                {/* 썸네일 (누르면 유튜브로 이동) */}
                                <VideoPlayer videoId={currentActivity.videoId} />

                                {/* 설명 영역 */}
                                <div className="bg-white rounded-[2rem] p-10 shadow-xl border border-rose-100 relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-2 h-full bg-rose-500"></div>
                                    <div className="flex items-start gap-6">
                                        <div className="p-4 bg-rose-50 text-rose-500 rounded-2xl shadow-inner">
                                            <Icon name="fileText" />
                                        </div>
                                        <div className="flex-1">
                                            <h3 className="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                                                교육 상세 안내
                                            </h3>
                                            <p className="text-lg text-slate-600 leading-relaxed whitespace-pre-wrap">
                                                {currentActivity.description || "등록된 상세 설명이 없습니다. 영상을 시청하며 안내에 따라주시기 바랍니다."}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="h-full flex flex-col items-center justify-center text-slate-300 gap-4">
                                <Icon name="calendar" />
                                <p className="text-xl font-medium">왼쪽 목록에서 교육 일정을 선택해 주세요.</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
